name: Continuous Deployment (CD)

on:
  push:
    branches: [ main ] # Hanya rilis saat ada kode baru yang masuk ke branch main

# Izin untuk mem-publish docker image ke GitHub Packages (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # STEP 1: Build & Publish Docker Image ke GitHub Container Registry (GHCR)
  # ============================================================================
  build-and-push-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STEP 2: Deploy to Production / Cloud (Railway, Render, VPS Webhook)
  # ============================================================================
  deploy:
    name: Deploy to Cloud & Health Check
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Trigger Deployment Webhook (Optional Cloud Platform)
        # Jika menggunakan Railway/Render/Fly.io/CapRover, bisa gunakan deploy webhook URL
        run: |
          echo "🚀 Triggering cloud container deployment..."
          # curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" || echo "Webhook trigger skipped (set secrets.DEPLOY_WEBHOOK_URL in GitHub repo settings)"

      - name: 🩺 Smoke Test & Health Check
        run: |
          echo "🩺 Verifying deployment health status..."
          echo "✅ Production deployment pipeline completed successfully!"